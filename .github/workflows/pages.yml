name: Publicar THE KINGDOM OF LOVE en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar videojuego
        id: deployment
        uses: actions/deploy-pages@v4
